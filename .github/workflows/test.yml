name: Tests

on:
  push:
  pull_request:

# A newer push to the same ref makes the in-flight run irrelevant. Cancelling frees the
# runners immediately instead of queueing the new run behind work nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The fast suites are split into independent jobs so they run side by side instead of in series.
# Each pays ~1 minute of checkout + `npm ci`, which is cheaper than waiting for the slowest one.
# Branch protection requires the `test` and `e2e` checks by name (.github/BRANCH_PROTECTION.md);
# both are aggregators over the jobs below so regrouping the work never changes what an
# administrator has to select.
jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  unit-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Component tests
        run: npm run test:component

  integration:
    runs-on: ubuntu-latest

    # Throwaway Postgres for the integration suite. It lives only for this job; the harness
    # builds and drops its own scratch databases inside it and never touches any real data.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # libpq connection vars consumed by test/integration/db.ts. The `postgres` superuser is
      # required because the harness creates databases, roles, and extensions.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # psql is the client the integration harness shells out to. The runner image already ships
      # one; only fall back to apt when it is missing.
      - name: Ensure Postgres client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - run: npm ci
      - name: Integration tests
        run: npm run test:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production build
        # Use the committed loopback-only E2E environment so the build never depends on hosted
        # Supabase credentials. Next builds route code but does not need the stack to be running.
        run: npm run build:e2e

  # Single check that gates on every fast suite. Branch protection requires `test` by name.
  test:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-component, integration, build]
    if: always()
    steps:
      - name: Require every fast suite to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null

  # End-to-end suite: boots the real app against an isolated local Supabase stack (Docker) and
  # drives it as admin/staff on desktop/mobile. No secrets — the local stack uses fixed dev keys.
  #
  # Split across runners rather than across workers. playwright.config.ts pins `workers: 1` on
  # purpose: parallel workers on one machine exhaust the Docker network's source sockets and turn
  # healthy GoTrue auth requests into 500s. Each shard is a separate runner with its own Docker
  # network and its own Supabase stack, so it stays serial locally while the suite runs in
  # parallel overall. Every shard pays the same fixed boot cost, so more shards only help while
  # the per-shard test time still dominates. Keep SHARD_TOTAL and the matrix list in step.
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One shard's failure should not hide the others' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD_TOTAL: '6'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Chromium is ~100MB and unchanged between runs; restoring it beats re-downloading it in
      # every shard. Keyed on the lockfile so a Playwright version bump busts the cache.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Start local Supabase, install the browser, and build the app
        # `supabase start` is dominated by image pulls and container health checks, so it runs in
        # the background while the CPU-bound browser install and `next build` happen in the
        # foreground. Only the services the suite needs (db + auth + kong gateway + rest). Docker
        # is preinstalled on ubuntu runners; the CLI is pinned as a devDependency.
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          npx supabase start -x studio,imgproxy,inbucket,edge-runtime,realtime,storage,meta,vector,analytics,functions > supabase-start.log 2>&1 &
          supabase_pid=$!

          if [ "$PLAYWRIGHT_CACHE_HIT" = 'true' ]; then
            # The browser binary is cached but its apt dependencies are not part of that cache.
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

          npm run build:e2e

          if ! wait "$supabase_pid"; then
            cat supabase-start.log
            echo '::error::supabase start failed'
            exit 1
          fi
          cat supabase-start.log

      - name: E2E tests
        # Playwright's webServer serves the build from the previous step (E2E_PREBUILT) with .env.e2e.
        # Setup projects re-run in every shard, which is required — each shard seeds its own stack.
        env:
          E2E_PREBUILT: '1'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7

  # Single check that gates on every shard. Branch protection requires the `e2e` check by name
  # (.github/BRANCH_PROTECTION.md); sharding must not change what an administrator has to select.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - name: Require every shard to pass
        run: |
          result='${{ needs.e2e-shard.result }}'
          echo "e2e-shard result: $result"
          [ "$result" = 'success' ] || exit 1
