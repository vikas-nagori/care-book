name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Throwaway Postgres for the integration suite. It lives only for this job; the harness
    # builds and drops its own scratch databases inside it and never touches any real data.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # libpq connection vars consumed by test/integration/db.ts. The `postgres` superuser is
      # required because the harness creates databases, roles, and extensions.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # psql is the client the integration harness shells out to.
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
